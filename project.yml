name: CrownReader
options:
  bundleIdPrefix: com.crownreader
  deploymentTarget:
    iOS: "17.0"
    watchOS: "10.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic

targets:
  CrownReader:
    type: application
    platform: iOS
    sources:
      - path: Sources/iOS
      - path: Sources/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.crownreader.phone
      INFOPLIST_FILE: Sources/iOS/Info.plist
      TARGETED_DEVICE_FAMILY: "1,2"
    dependencies:
      - target: CrownReaderWatch
        embed: true

  CrownReaderWatch:
    type: application
    platform: watchOS
    sources:
      - path: Sources/Watch
      - path: Sources/Shared
    settings:
      PRODUCT_BUNDLE_IDENTIFIER: com.crownreader.phone.watchkitapp
      INFOPLIST_FILE: Sources/Watch/Info.plist
      ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
